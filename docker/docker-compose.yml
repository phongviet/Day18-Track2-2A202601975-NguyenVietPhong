services:
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        for b in lakehouse bronze silver gold; do
          mc mb --ignore-existing local/$$b
        done
        echo "Buckets ready: lakehouse, bronze, silver, gold"

  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.0
    container_name: lakehouse-spark
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      JUPYTER_TOKEN: lakehouse
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      SPARK_IVY_DIR: /home/jovyan/.cache/ivy
      # Must include the image's own Spark entries, not replace them: pyspark
      # is exposed purely via PYTHONPATH here. Setting this to just
      # /workspace/scripts (as it was) killed `import pyspark` everywhere.
      # Set at container level so `docker compose exec` (i.e. `make
      # spark-smoke`) sees it too — the image's 10spark-config.sh hook only
      # runs for the main process. py4j version tracks the pinned image tag.
      PYTHONPATH: /workspace/scripts:/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip
    volumes:
      - ../:/workspace
      # Maven JARs are cached under .cache/ivy (see SPARK_IVY_DIR below).
      # A named volume on ~/.ivy2 does NOT work: that path does not exist in
      # the image, so Docker creates the volume root-owned and jovyan cannot
      # write to it — Ivy then dies with FileNotFoundException and the JVM
      # exits before the Py4J gateway starts. ~/.cache DOES exist in the
      # image, so its volume inherits jovyan ownership.
      - ipython-cache:/home/jovyan/.cache
    working_dir: /workspace
    command:
      - bash
      - -c
      - |
        set -e
        # `pip install --user` lands console scripts in ~/.local/bin, which is
        # NOT on PATH in this image. Calling `jupytext` directly therefore died
        # with 127 and `set -e` killed the container before Jupyter ever
        # started. Export it for interactive shells, and invoke the module
        # form below so the conversion never depends on PATH at all.
        export PATH="$$HOME/.local/bin:$$PATH"
        echo ">> Installing Python deps (cached after first run)…"
        pip install --quiet --user \
          delta-spark==3.2.0 \
          jupytext==1.16.4 \
          faker==30.3.0 \
          "deltalake>=1.0,<2.0" \
          "pyiceberg[sql-sqlite,pyarrow]>=0.9,<1.0" \
          "duckdb>=1.1,<2.0" \
          "polars>=1.13.2,<2.0"
        echo ">> Auto-converting .py percent files to .ipynb (one-time per file)…"
        # Both trees: notebooks/ (lightweight, needs the deps above) and
        # notebooks-spark/ (PySpark). The container serves /workspace, so a
        # student can open either — convert both or half the repo looks empty.
        # NOTE: every literal dollar below is doubled. Compose interpolates
        # this whole block - comments included - and reads shell parameter
        # expansion as a variable reference, failing with "invalid
        # interpolation format". That silently broke `make spark-up` on
        # Compose v2+. Doubling the dollar passes it through to bash.
        # Conversion is best-effort: on a native-Linux host whose UID is not
        # 1000, the bind mount is owned by the host user and jovyan cannot
        # write into it. That must NOT stop the lab from starting - Jupyter's
        # jupytext extension can still open the .py files directly.
        for d in /workspace/notebooks /workspace/notebooks-spark; do
          [ -d "$$d" ] || continue
          cd "$$d" || continue
          for f in *.py; do
            ipynb="$${f%.py}.ipynb"
            if [ ! -f "$$ipynb" ]; then
              python -m jupytext --to notebook "$$f" 2>/dev/null \
                || echo "   (skipped $$f - mount not writable by uid $$(id -u); open the .py directly in Jupyter)"
            fi
          done
        done
        cd /workspace
        echo ">> Starting Jupyter (token: lakehouse)…"
        cd /workspace
        start-notebook.py \
          --IdentityProvider.token=lakehouse \
          --ServerApp.root_dir=/workspace

volumes:
  minio-data:
  ipython-cache:
